name: build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundle: dmg/*.dmg
          - os: windows-latest
            bundle: msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Engine tests
        run: |
          uv sync --group build
          uv run ruff check motio tests
          uv run pytest -q
      - name: Freeze engine
        run: uv run --group build python tools/build_engine.py

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build app
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: motio-${{ matrix.os }}
          path: app/src-tauri/target/release/bundle/${{ matrix.bundle }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/src-tauri/target/release/bundle/${{ matrix.bundle }}
