name: Release

# Tag vX.Y.Z (same version as app/src-tauri/tauri.conf.json) → macOS .dmg + Windows .msi/.exe → draft GitHub Release.
# Installers are unsigned and do not bundle the Python engine: point the app at a running engine in
# Cài đặt → "Engine từ xa". Pull requests that change this file build the installers without releasing.
# In-app updates: with the TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) secrets, the build also signs update bundles and the
# release gets latest.json; the app reads releases/latest/download/latest.json, so it sees the update once the draft is
# published (app/src-tauri/src/updater.rs).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest # Apple Silicon
            bundles: app,dmg
            artifacts: |
              app/src-tauri/target/release/bundle/dmg/*.dmg
              app/src-tauri/target/release/bundle/macos/*.app.tar.gz
              app/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows
            os: windows-latest
            bundles: msi,nsis
            artifacts: |
              app/src-tauri/target/release/bundle/msi/*.msi
              app/src-tauri/target/release/bundle/msi/*.msi.sig
              app/src-tauri/target/release/bundle/nsis/*.exe
              app/src-tauri/target/release/bundle/nsis/*.exe.sig
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in app/src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: pnpm install --frozen-lockfile
      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ -z "$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")" ]; then
              echo "::error::plugins.updater.pubkey is empty in app/src-tauri/tauri.conf.json"
              exit 1
            fi
            # A file, not inline JSON, so Windows shells keep the quotes.
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > updater.conf.json
            pnpm tauri build --bundles ${{ matrix.bundles }} --config updater.conf.json
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing: a release needs signed update bundles"
            exit 1
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: building without update bundles"
            pnpm tauri build --bundles ${{ matrix.bundles }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: motio-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Artifacts keep their bundle/<type>/ folders; flatten them and keep the update signatures out of the release.
      - name: Collect release files
        run: |
          mkdir files sigs
          find dist -type f -name '*.sig' -exec mv {} sigs/ \;
          find dist -type f -exec mv {} files/ \;
          ls -l files sigs
      - uses: softprops/action-gh-release@v2
        id: draft
        with:
          draft: true
          generate_release_notes: true
          files: files/*
      - name: Attach the updater manifest (latest.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.id }}" > release.json
          python3 tools/updater_manifest.py --version "$GITHUB_REF_NAME" --release release.json --sigs sigs \
            --repo "$GITHUB_REPOSITORY" > latest.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --repo "$GITHUB_REPOSITORY" --clobber
