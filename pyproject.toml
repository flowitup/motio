[project]
name = "motio"
version = "0.1.0"
description = "Motio — web app làm video tiếng Pháp từ tin nóng và Pháp hoá kênh"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "yt-dlp[default]>=2026.8.19",
  "f2==0.0.1.7",
  "pillow>=10.4",
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "anthropic>=1.8",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.0; sys_platform != 'darwin'",
]

[tool.uv]
package = false

# f2 (Douyin client, motio/douyin.py) pins exact versions of everything, even pytest and black which it never imports.
# That clashes with the engine's own (pytest, yt-dlp's websockets>=13, ...), so list here what f2 needs at run time,
# with lower bounds only. It runs on the versions uv.lock picks for the engine (live-checked, see docs/APP_PLAN.md).
# Left out on purpose: browser-cookie3 (LGPL, reads browser cookie stores) and pyexecjs (runs JavaScript for livestreams):
# f2 only imports them, and motio/douyin.py hands it empty modules of those names.
[[tool.uv.dependency-metadata]]
name = "f2"
version = "0.0.1.7"
requires-dist = [
  "aiofiles>=24.1",
  "aiosqlite>=0.20",
  "babel>=2.13",
  "click>=8.1",
  "cryptography>=44",
  "gmssl>=3.2.2",
  "httpx>=0.27",
  "importlib-resources>=6.4",
  "jsonpath-ng>=1.6.1",
  "m3u8>=3.6",
  "protobuf>=5.28",
  "pydantic>=2.9",
  "pyyaml>=6",
  "qrcode>=8",
  "rich>=13.9",
  "websockets>=13",
  "websockets-proxy>=0.1.2",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
