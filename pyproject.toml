[project]
name = "studio"
version = "0.1.0"
description = "Studio — web app làm video tiếng Pháp từ tin nóng và Pháp hoá kênh"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "yt-dlp>=2025.1.1",
  "pillow>=10.4",
  "anthropic>=0.40",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.0; sys_platform != 'darwin'",
]

[tool.uv]
package = false
