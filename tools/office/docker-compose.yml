# Motio Office on folio-prod-1: bound to localhost only; office.flowitup.com reaches it through the
# Cloudflare tunnel (ingress rule in /etc/cloudflared/config.yml → http://localhost:8787).
name: motio-office
services:
  office:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8787:8787"]
    env_file: .env
    volumes: ["office-data:/data"]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
volumes:
  office-data:
